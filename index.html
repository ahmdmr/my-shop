<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Tajawal&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Cairo&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic&display=swap" rel="stylesheet">
        <script>
            function opensection(section) {
                document.getElementById("categories").style.display = "none";
                document.getElementById("main-title").style.display = "none";
                document.getElementById(section + "-section").style.display = "block";
                document.getElementById("Exit").style.display = "block";
            }
            function exit() {
                document.getElementById("categories").style.display = "flex";
                document.getElementById("main-title").style.display = "block";
                document.getElementById("Exit").style.display = "none";
                document.getElementById("anime-section").style.display = "none";
                document.getElementById("gadget-section").style.display = "none";
                document.getElementById("other-section").style.display = "none";
                document.getElementById("item-page").style.display = "none";
            }
            function openitem(name, price, img, section) {
                document.getElementById("other-section").style.display = "none";
                document.getElementById("Exit").style.display = "none";
                document.getElementById("Exit2").style.display = "block";
                document.getElementById("anime-section").style.display = "none";
                document.getElementById("gadget-section").style.display = "none";
                document.getElementById("item-page").style.display = "flex";
                document.getElementById("item-img").src = img;
                document.getElementById("item-name").innerHTML = name;
                document.getElementById("item-price").innerHTML = price;
                document.getElementById("Exit2").onclick = function() {
                    document.getElementById("Exit").style.display = "block";
                    document.getElementById("Exit2").style.display = "none";
                    document.getElementById("item-page").style.display = "none";
                    document.getElementById(section + "-section").style.display = "block";
                }
                document.getElementById("order-link").href = `https://docs.google.com/forms/d/e/1FAIpQLSdQZG5-mQ5wFMiQ5gC3Y3E_QVePkAl0Ns0RZXqs6M5MbvyNwg/viewform?usp=pp_url&entry.1502566727=${name}`;
            }
            function togglesetting() {
                let list = document.getElementById("setting-list");
                if (list.style.display === "none" || list.style.display === "") {
                    list.style.display = "block";
            }   
            else {
                    list.style.display = "none";
        }
}

const translations = {
    english: {
        title: "Anime Shop",
        anime: "Anime",
        gadgets: "Gadgets",
        other: "Other",
        language: "Language",
        item1: "Item 1",
        item2: "Item 2",
        item3: "Item 3",
        price1: "5000SYP",
        price2: "10000SYP",
        price3: "15000SYP",
        price4: "20000SYP",
        price5: "25000SYP",
        price6: "30000SYP",
        price7: "7500SYP",
        price8: "5500SYP",
        price9: "2500SYP"
    },
    arabic: {
        title: "متجر أنمي",
        anime: "أنمي",
        gadgets: "غادجت",
        other: "أخرى",
        language: "اللغة",
        item1: "الغرض الاول",
        item2: "الغرض الثاني",
        item3: "الغرض الثالث",
        price1: "5000 ل.س",
        price2: "10000 ل.س",
        price3: "15000 ل.س",
        price4: "20000 ل.س",
        price5: "25000 ل.س",
        price6: "30000 ل.س",
        price7: "7500 ل.س",
        price8: "5500 ل.س",
        price9: "2500 ل.س"
    }
}

let currentLang = "english";

function changelanguage() {
    // switch between english and arabic
    currentLang = currentLang === "english" ? "arabic" : "english";
    
    // update all text
    document.getElementById("main-title").innerHTML = translations[currentLang].title;
    document.getElementById("anime-btn").innerHTML = translations[currentLang].anime;
    document.getElementById("gadget-btn").innerHTML = translations[currentLang].gadgets;
    document.getElementById("other-btn").innerHTML = translations[currentLang].other;
    document.getElementById("setting-list").innerHTML = translations[currentLang].language;
    document.getElementById("item-wrd1").innerHTML = translations[currentLang].item1;
    document.getElementById("item-wrd2").innerHTML = translations[currentLang].item2;
    document.getElementById("item-wrd3").innerHTML = translations[currentLang].item3;
    document.getElementById("item-price1").innerHTML = translations[currentLang].price1;
    document.getElementById("item-price2").innerHTML = translations[currentLang].price2;
    document.getElementById("item-price3").innerHTML = translations[currentLang].price3;
    document.getElementById("item-price4").innerHTML = translations[currentLang].price4;
    document.getElementById("item-price5").innerHTML = translations[currentLang].price5;
    document.getElementById("item-price6").innerHTML = translations[currentLang].price6;
    document.getElementById("item-price7").innerHTML = translations[currentLang].price7;
    document.getElementById("item-price8").innerHTML = translations[currentLang].price8;
    document.getElementById("item-price9").innerHTML = translations[currentLang].price9;
    // switch text direction
    document.body.style.direction = currentLang === "arabic" ? "rtl" : "ltr";
}

        </script>
        <title>Ahmad's Shop sy</title>
        <style>
            body {
                background-color: #1a1a2e;
                font-family: 'Noto Kufi Arabic', sans-serif;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 5px;
            }

            .title {
                color: white;
                text-align: center;
                margin-top: 30px;
            }

            .container {
                display: flex;
                justify-content: center;
                gap: 20px;
                flex-wrap: wrap;
            }

            .box {
                background-color: #16213e;
                width: 160px;
                border-radius: 15px;
                text-align: center;
                cursor: pointer;
                transition: 0.3s;
            }

            .box img {
                width: 150px;
                height: 150px;
                border-radius: 10px;
            }

            .box p {
                color: white;
                font-size: 15px;
                margin-top: 10px;
            }

            .box h3 {
                color: white;
                margin-top: 10px;
            }

            .box:hover {
                scale: 1.1;
                background-color: #11192f;
            }

           .section {
                display: none;
            }

            .section-title {
                color: white;
                text-align: center;
                margin-bottom: 30px;
            }

            .exit {
                position: fixed;
                top: 20px;
                left: 20px;
                width: 50px;
                display: none;
                cursor: pointer;
                transition: 0.3s;
            }

            .exit:hover {
                scale: 1.1;
            }

            .exit img {
                width: 50px;
            }

            .item {
                background-color: #16213e;
                color: white;
    
                width: 95%;
                max-width: 700px;
                height: auto;
                min-height: 400px;
                box-sizing: border-box;
                margin: 0 auto;
                overflow: auto;     
                border-radius: 15px;
                padding: 40px;
                padding-top: 80px;
                text-align: left;
    
                display: none;
                flex-direction: column;
            }

            .item img {
                align-self: center;
                width: 100%;
                max-width: 280px;
                height: auto;
                border-radius: 10px;
                object-fit: cover;
            }

            .btn {
                background-color: rgb(42, 163, 42);
                color: white;
                border: none;
                border-radius: 10px;
                width: 100px;
                height: 40px;
                cursor: pointer;
            }

            a {
                display: flex;
                width: fit-content;
                cursor: pointer;
            }

            .setting {
                position: fixed;
                top: 20px;
                right: 20px;
                width: 50px;
                cursor: pointer;
                transition: 0.3s;
            }

            .setting:hover {
                scale: 1.1;
            }

            .setting img {
                width: 50px;
            }
            
            .setting-list {
                position: fixed;
                top: 80px;
                right: 20px;
                width: 200px;
                height: 40px;
                padding: 8px;
                border-radius: 5px;
                background-color: white;
                display: none;
                border: none;
            }

            @media (max-width: 600px) {
                .box p {
                    font-size: 14px;
                }
                .item {
                    height: 850px;
                    overflow: hidden;
                }
}
            
        </style>
    </head>
    <body>
        <h1 class="title" id="main-title">Anime shope sy</h1>

            <div class="box" onclick="opensection('anime')">

            <div class="box" onclick="opensection('other')">

        </div>

    </body>
</html>
